<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="800x800">
<link rel="stylesheet" href="../brand.css">
<style>
body{background:var(--accent);position:relative}
.dot{position:absolute;border-radius:50%}
.d1{width:150px;height:150px;left:-30px;top:-30px;background:var(--ink)}
.d2{width:58px;height:58px;right:96px;top:96px;background:var(--paper)}
.ph{position:absolute;left:80px;top:80px;width:640px;height:640px;border-radius:50%;overflow:hidden;background:#2c2c2e;box-shadow:0 0 0 14px var(--ink)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.12);transform-origin:50% 22%}
.badge{position:absolute;right:34px;bottom:34px;width:172px;height:172px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 12px var(--ink);display:grid;place-items:center}
.badge div{width:112px;height:112px}
.mono-big{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:340px;font-weight:600;letter-spacing:-.05em;color:var(--ink)}
</style></head><body>
<div class="dot d1"></div>
<div class="ph" id="ph"><img data-photo alt=""></div>
<div class="mono-big" id="mb" style="display:none">AE</div>
<div class="badge" id="bd"><div data-mark></div></div>
<script src="../brand.js"></script>
<script>var q=new URLSearchParams(location.search),d={};try{d=JSON.parse(q.get("data")||"{}")}catch(e){}
if(!d.photo){document.getElementById("bd").style.display="none";document.getElementById("ph").style.display="none";document.getElementById("mb").style.display="grid"}</script>
</body></html>
